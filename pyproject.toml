[project]
name = "goodminton-rag-service"
version = "0.1.0"
description = "RAG chatbot service tư vấn sản phẩm cầu lông cho Goodminton Shop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "httpx>=0.25",
    "langchain-text-splitters>=0.0.1",
    "python-dotenv>=1.0",
    "aio-pika>=9.4",
    "beautifulsoup4>=4.12",
    "langfuse>=3.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
